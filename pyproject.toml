[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwpm"
version = "0.1.0"
description = "Hospital ward process mining: motion waste and MDT synchronisation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Split so the governance CLI stays installable without the heavy scientific
# stack -- `hwpm govern` must work on any machine, including one that only needs
# to read the audit log.
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pm4py>=2.7",
    "pyarrow>=15.0",
]
optimize = [
    "ortools>=9.9",
]
# SPEC-007 Part A vector half (N19b, ADR-0007 G2 reopened). `hwpm govern`
# stays installable without this -- `hwpm.retrieve.vector`/`hwpm.retrieve.hybrid`
# import neither package at module scope, only lazily when a function that
# needs them is actually called (SPEC-007 criteria 8-9).
retrieve = [
    "fastembed>=0.3",
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "vulture>=2.11",
    "import-linter>=2.0",
]

[project.scripts]
hwpm = "hwpm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwpm"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A throwaway demo generator, not part of the governed SPEC-001 pipeline: its
# own docstring says so, it produces no ground truth, and nothing in
# orchestration/graph.yaml depends on it. Exempted from line length rather than
# reformatted, so the file stays as its author wrote it. If it ever becomes a
# real fixture source, delete this entry and bring it up to standard first.
"tools/generate_rfid_demo_log.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["bench: throughput benchmarks, not run by default"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

# The domain layer is the contract everything else depends on, so it is held to
# a stricter standard than the adapters around it. Tightening the rest follows
# as each spec lands rather than all at once.
[[tool.mypy.overrides]]
module = "hwpm.domain.*"
disallow_untyped_defs = true
strict_equality = true

[tool.coverage.run]
source = ["src/hwpm"]

[tool.vulture]
min_confidence = 80
# See docs/06-QA-AND-DEADCODE.md: the Python fitness reference is the
# correctness oracle for any future C kernel (ADR-0003), not dead code.
ignore_names = ["evaluate_reference"]

# Enforces the layering rule in docs/02-ARCHITECTURE.md. An architecture that is
# only documented decays one import at a time.
[tool.importlinter]
root_package = "hwpm"
# Required so the ADR-0008 contract can name pm4py, an external package.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on nothing"
type = "forbidden"
source_modules = ["hwpm.domain"]
forbidden_modules = [
    "hwpm.ingest",
    "hwpm.mining",
    "hwpm.optimize",
    "hwpm.govern",
    "hwpm.design",
    "hwpm.artefact",
    "hwpm.retrieve",
    "hwpm.analytics",
    "hwpm.cli",
]

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
# hwpm.artefact sits between ingest and domain: every stage above it writes a
# strategy-keyed envelope (SPEC-001 criterion 10, ADR-0006 section 2), and it
# knows only the domain types the envelope carries. N04.
# hwpm.retrieve sits alongside it, same level: an adapter over repo text
# (SPEC-007 Part A) that touches no patient data and does not depend on, or
# get depended on by, hwpm.artefact -- the sub-list marks them independent so
# neither may import the other. N19.
# hwpm.analytics sits above hwpm.mining, not beside artefact/retrieve: its
# uncertainty model (SPEC-003 "Uncertainty" source 1, episode-derivation
# parameter sensitivity) reads SPEC-002's EpisodeParams sweep from
# hwpm.mining, so it needs to be a layer that is *allowed* to import mining,
# not a sibling of the artefact/retrieve pair that only needs hwpm.domain.
layers = [
    "hwpm.cli",
    "hwpm.optimize",
    "hwpm.analytics",
    "hwpm.mining",
    "hwpm.ingest",
    # import-linter 2.x spells "independent siblings at one level" as a single
    # string joined by `|`; a TOML sub-list raises `'list' object has no
    # attribute 'strip'` and takes gate 6 down for every node. Corrected N04.
    "hwpm.artefact | hwpm.retrieve",
    "hwpm.domain",
]

# SPEC-007 criterion 14 / ADR-0007 decision 5. The most important contract in
# this file, and the one written as a prohibition because it is the one that
# would be traded away under pressure.
#
# An embedding may never be the basis of a reported governance figure without an
# interpretable derivation published alongside. The named modules are the ones
# that produce or underpin published figures: `coverage` is the N18 MDT-coverage
# view, `motion` is SPEC-003's attributable-motion figure, `bounds` is the proven
# lower bound `motion` rests on, and `suppression` is the ADR-0005 floor all of
# them apply. None may reach `hwpm.mining.embed`.
#
# Two structural notes that make this contract bite rather than decorate:
#
#  1. `hwpm.mining.embed` is deliberately NOT re-exported from
#     `hwpm/mining/__init__.py`, and `hwpm.analytics.cohorts` is deliberately NOT
#     re-exported from `hwpm/analytics/__init__.py`. `hwpm.analytics.coverage`
#     imports `hwpm.mining.mdt`, which pulls in the parent package `hwpm.mining`;
#     had `embed` been re-exported there, every governance module would import it
#     transitively through a package `__init__` nobody was looking at, and this
#     contract would fail for a reason unrelated to anyone's intent -- or worse,
#     be "fixed" by loosening it.
#  2. `hwpm.analytics.cohorts` (which publishes cluster summaries, and therefore
#     does import `embed`) is listed as forbidden to the four figure modules too,
#     so the dependency cannot be laundered one hop.
[[tool.importlinter.contracts]]
name = "Governance figures do not depend on embeddings (ADR-0007)"
type = "forbidden"
source_modules = [
    "hwpm.analytics.coverage",
    "hwpm.analytics.motion",
    "hwpm.analytics.bounds",
    "hwpm.analytics.suppression",
]
forbidden_modules = [
    "hwpm.mining.embed",
    "hwpm.analytics.cohorts",
]

# ADR-0008: pm4py is AGPL v3. Confining it to one adapter keeps the dependency
# swappable at a known, small cost while the organisation answers the licensing
# question. A Protocol boundary is not a legal firewall -- it buys optionality.
[[tool.importlinter.contracts]]
name = "pm4py confined to its adapter (AGPL -- ADR-0008)"
type = "forbidden"
source_modules = [
    "hwpm.domain",
    "hwpm.ingest",
    "hwpm.optimize",
    "hwpm.govern",
    "hwpm.design",
    "hwpm.artefact",
    "hwpm.retrieve",
    "hwpm.analytics",
    "hwpm.cli",
    # hwpm.mining itself must be listed too -- ADR-0008 says "nothing else in
    # the codebase", which includes _pm4py_adapter.py's siblings within this
    # same package, not just the outer layers. Without this line the contract
    # only fenced pm4py out of the *other* layers and would pass with a stray
    # `import pm4py` sitting right next to the adapter (N05, verified: an
    # `import pm4py` added to a sibling file under src/hwpm/mining/ was NOT
    # caught before this line was added, and is caught after it).
    "hwpm.mining",
]
forbidden_modules = ["pm4py"]
# The adapter is the one sanctioned place pm4py is imported (ADR-0008 part 1).
ignore_imports = ["hwpm.mining._pm4py_adapter -> pm4py"]
unmatched_ignore_imports_alerting = "none"
