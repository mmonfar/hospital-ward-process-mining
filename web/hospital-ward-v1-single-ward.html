<style>
  three-d-stage:not(:defined) { visibility: hidden; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #eef1f0; }
  #ui {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  #header {
    pointer-events: auto;
    padding: 20px 24px 0 24px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
  }
  #title-block h1 {
    margin: 0; font-size: 18px; font-weight: 700; color: #1c2b30; letter-spacing: -0.01em;

    display: flex; flex-direction: column; gap: 6px; min-width: 168px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #26333a; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #bottom {
    pointer-events: auto;
    display: flex; gap: 16px; align-items: flex-end;
    padding: 0 24px 20px 24px;
  }
  #timeline-panel {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.94); backdrop-filter: blur(6px);
    border-radius: 12px; padding: 14px 18px; box-shadow: 0 2px 14px rgba(20,40,40,0.1);
  }
  #time-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #play-btn {

  }
  #play-btn:hover { background: #106064; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: #1c2b30; min-width: 78px; }

  .log-item.done { color: #33454b; }

<body>

<three-d-stage id="stage" name="hospital-ward-rounds" background="#eef1f0"></three-d-stage>
<script src="./three-d-stage.js"></script>

<div id="ui">
  <div id="header">
    <div id="title-block">
      <h1>Ward 4B — Rounds Timeline</h1>
      <p>Bed 3 draws four separate subspecialty visits over one morning. None coordinate with each other, and each one pulls the ward nurse away from her routine rounds.</p>
    </div>
    <div id="legend">
      <div class="legend-row"><span class="legend-dot" style="background:#16777a"></span>Nurse</div>
      <div class="legend-row"><span class="legend-dot" style="background:#d6455f"></span>Cardiology</div>
      <div class="legend-row"><span class="legend-dot" style="background:#7c5cbf"></span>Nephrology</div>
      <div class="legend-row"><span class="legend-dot" style="background:#d99a2b"></span>Infectious Disease</div>
      <div class="legend-row"><span class="legend-dot" style="background:#4f9d5c"></span>Physical Therapy</div>
    </div>
  </div>
  <div id="bottom">
    <div id="timeline-panel">
      <div id="time-row">
        <button id="play-btn" aria-label="Play">▶</button>
        <div id="clock">7:00 AM</div>
        <input id="slider" type="range" min="420" max="660" step="1" value="420">
      </div>
      <div id="status">Nurse pulled to Bed 3: <b id="pull-count">0</b> times so far</div>
    </div>
    <div id="log-panel"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
await stage.ready;

// ---------- palette ----------
const PALETTE = {
  floor: 0xe7e2d8, wall: 0xcfd8d6, bedFrame: 0xb9c0c2, mattress: 0xf5f2ea,
  pillow: 0xffffff, curtainFabric: 0x6f93a0, curtainTrack: 0x8a8f91,
  deskWood: 0xa9835a, deskTop: 0xdcd3c4, chair: 0x35424a, monitorScreen: 0x1c2b30,
  ivPole: 0x9aa3a5, bedFoot: 0x9aa3a5,
};
const ROLE_COLOR = {
  nurse: 0x16777a, cardiology: 0xd6455f, nephrology: 0x7c5cbf,
  id: 0xd99a2b, pt: 0x4f9d5c,
};

const mat = {};
function getMat(key, color, opts) {
  if (!mat[key]) mat[key] = new THREE.MeshStandardMaterial(Object.assign({ color, name: key }, opts));
  return mat[key];
}

// ---------- ward architecture ----------
const root = new THREE.Group();
const ward = new THREE.Group();
ward.name = 'ward';
root.add(ward);

const ROOM_W = 12, ROOM_D = 8, WALL_H = 2.6;

const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.08, ROOM_D), getMat('floor', PALETTE.floor, { roughness: 0.85 }));
floor.name = 'floor'; floor.position.y = -0.04;
ward.add(floor);

function wall(w, h, d, x, y, z, name) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), getMat('wall', PALETTE.wall, { roughness: 0.95 }));
  m.name = name; m.position.set(x, y, z);
  ward.add(m);
  return m;
}
wall(ROOM_W, WALL_H, 0.15, 0, WALL_H / 2, -ROOM_D / 2, 'wall_north');
wall(ROOM_W, WALL_H, 0.15, 0, WALL_H / 2, ROOM_D / 2, 'wall_south');
wall(0.15, WALL_H, ROOM_D, ROOM_W / 2, WALL_H / 2, 0, 'wall_east');

// ---------- beds ----------
const bedPositions = [
  { x: -4, z: -2.5, facing: 1, label: 'Bed 1' },
  { x: 0,  z: -2.5, facing: 1, label: 'Bed 2' },
  { x: 4,  z: -2.5, facing: 1, label: 'Bed 3' },
  { x: -4, z: 2.5,  facing: -1, label: 'Bed 4' },
  { x: 0,  z: 2.5,  facing: -1, label: 'Bed 5' },
  { x: 4,  z: 2.5,  facing: -1, label: 'Bed 6' },
];

function buildBed(i, p) {
  const g = new THREE.Group();
  g.name = 'bed_' + i;
  g.position.set(p.x, 0, p.z);

  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.42, 1.95), getMat('bedFrame', PALETTE.bedFrame, { roughness: 0.5, metalness: 0.3 }));
  frame.name = 'bedFrame_' + i; frame.position.y = 0.21;
  g.add(frame);

  const mattress = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.18, 1.88), getMat('mattress', PALETTE.mattress, { roughness: 0.9 }));
  mattress.name = 'mattress_' + i; mattress.position.y = 0.42 + 0.09;
  g.add(mattress);

  const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.32), getMat('pillow', PALETTE.pillow, { roughness: 0.95 }));
  pillow.name = 'pillow_' + i;
  pillow.position.set(0, 0.42 + 0.18 + 0.06, -p.facing * 0.72);
  g.add(pillow);

  const headH = 0.75;
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.0, headH, 0.06), getMat('bedFrame', PALETTE.bedFrame, { roughness: 0.5, metalness: 0.3 }));
  head.name = 'headboard_' + i;
  head.position.set(0, headH / 2, -p.facing * 0.97);
  g.add(head);

  const footH = 0.5;
  const foot = new THREE.Mesh(new THREE.BoxGeometry(1.0, footH, 0.05), getMat('bedFoot', PALETTE.bedFoot, { roughness: 0.5, metalness: 0.35 }));
  foot.name = 'footboard_' + i;
  foot.position.set(0, footH / 2, p.facing * 0.98);
  g.add(foot);

  const poleH = 1.5;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, poleH, 10), getMat('ivPole', PALETTE.ivPole, { roughness: 0.4, metalness: 0.6 }));
  pole.name = 'ivPole_' + i;
  pole.position.set(0.65, poleH / 2, -p.facing * 0.9);
  g.add(pole);
  const bag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.04), getMat('ivBag', 0xdfeaf0, { roughness: 0.3, transparent: true, opacity: 0.85 }));
  bag.name = 'ivBag_' + i;
  bag.position.set(0.65, poleH - 0.12, -p.facing * 0.9);
  g.add(bag);

  ward.add(g);
}
bedPositions.forEach((p, i) => buildBed(i, p));

// ---------- curtain dividers between adjacent beds in a row ----------
function buildCurtain(i, x, z) {
  const g = new THREE.Group();
  g.name = 'curtain_' + i;
  g.position.set(x, 0, z);
  const track = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 2.1), getMat('curtainTrack', PALETTE.curtainTrack, { roughness: 0.4, metalness: 0.6 }));
  track.name = 'curtainTrack_' + i; track.position.y = 2.15;
  g.add(track);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.9, 0.85), getMat('curtainFabric', PALETTE.curtainFabric, { roughness: 0.9 }));
  panel.name = 'curtainFabric_' + i;
  panel.position.set(0, 1.05, -0.55);
  g.add(panel);
  ward.add(g);
}
[-2, 2].forEach((x, idx) => { buildCurtain('n' + idx, x, -2.5); buildCurtain('s' + idx, x, 2.5); });

// ---------- nurse station ----------
const station = new THREE.Group();
station.name = 'nurseStation';
station.position.set(-5.3, 0, 0);
const desk = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.75, 1.6), getMat('deskWood', PALETTE.deskWood, { roughness: 0.6 }));
desk.name = 'deskBody'; desk.position.y = 0.375;
station.add(desk);
const deskTop = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.05, 1.7), getMat('deskTop', PALETTE.deskTop, { roughness: 0.5 }));
deskTop.name = 'deskTop'; deskTop.position.y = 0.775;
station.add(deskTop);
const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.24, 0.03), getMat('monitorScreen', PALETTE.monitorScreen, { roughness: 0.3 }));
monitor.name = 'monitorScreen'; monitor.position.set(0.15, 1.0, 0.4); monitor.rotation.y = Math.PI / 2;
station.add(monitor);
const chairSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.06, 20), getMat('chair', PALETTE.chair, { roughness: 0.7 }));
chairSeat.name = 'chairSeat'; chairSeat.position.set(0.9, 0.46, 0);
station.add(chairSeat);
const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 0.4), getMat('chair', PALETTE.chair, { roughness: 0.7 }));
chairBack.name = 'chairBack'; chairBack.position.set(1.1, 0.7, 0);
station.add(chairBack);
const chairPost = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 10), getMat('chairMetal', 0x9aa3a5, { roughness: 0.4, metalness: 0.6 }));
chairPost.name = 'chairPost'; chairPost.position.set(0.9, 0.22, 0);
station.add(chairPost);
ward.add(station);

// ---------- role markers ----------
const markers = new THREE.Group();
markers.name = 'markers';
root.add(markers);

function buildMarker(name, color) {
  const g = new THREE.Group();
  g.name = 'marker_' + name;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.42, 6, 12), new THREE.MeshStandardMaterial({ color, roughness: 0.5, name: 'markerBody_' + name }));
  body.name = 'markerBody_' + name;
  body.position.y = 0.14 + 0.21;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshStandardMaterial({ color, roughness: 0.5, name: 'markerHead_' + name }));
  head.name = 'markerHead_' + name;
  head.position.y = 0.14 + 0.42 + 0.11;
  g.add(head);
  markers.add(g);
  return g;
}
const nurseMarker = buildMarker('nurse', ROLE_COLOR.nurse);
const cardioMarker = buildMarker('cardiology', ROLE_COLOR.cardiology);
const nephroMarker = buildMarker('nephrology', ROLE_COLOR.nephrology);
const idMarker = buildMarker('id', ROLE_COLOR.id);
const ptMarker = buildMarker('pt', ROLE_COLOR.pt);

// ---------- trails (persisting path traces) ----------
const trails = new THREE.Group();
trails.name = 'trails';
root.add(trails);
function makeTrailMesh(name, color) {
  const mtl = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, name: 'trail_' + name });
  const m = new THREE.Mesh(new THREE.BufferGeometry(), mtl);
  m.name = 'trailMesh_' + name;
  m.visible = false;
  trails.add(m);
  return m;
}
const trailMeshes = {
  nurse: makeTrailMesh('nurse', ROLE_COLOR.nurse),
  cardiology: makeTrailMesh('cardiology', ROLE_COLOR.cardiology),
  nephrology: makeTrailMesh('nephrology', ROLE_COLOR.nephrology),
  id: makeTrailMesh('id', ROLE_COLOR.id),
  pt: makeTrailMesh('pt', ROLE_COLOR.pt),
};
function updateTrail(mesh, points) {
  if (points.length < 2) { mesh.visible = false; return; }
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.1);
  const geo = new THREE.TubeGeometry(curve, Math.max(8, points.length * 6), 0.03, 6, false);
  mesh.geometry.dispose();
  mesh.geometry = geo;
  mesh.visible = true;
}

stage.setObject(root);

// ---------- world positions for beds / station / off-scene spawns ----------
const bedPos = bedPositions.map(p => new THREE.Vector3(p.x, 0.02, p.z + (p.facing * -0.3)));
const stationPos = new THREE.Vector3(-4.6, 0.02, 0.9);
const OFF_A = new THREE.Vector3(-6.6, 0.02, -1.2);
const OFF_B = new THREE.Vector3(-6.6, 0.02, 1.2);
const B = i => bedPos[i];

// ---------- timeline data ----------
// times in minutes from midnight, 420 = 7:00 AM
const nurseWP = [
  [420, stationPos], [425, B(0)], [432, B(0)], [440, B(1)], [447, B(1)],
  [455, B(3)], [462, B(3)], [470, B(2)], [478, B(2)],
  [490, B(5)], [497, B(5)], [505, B(2)], [513, B(2)],
  [525, B(4)], [532, B(4)], [545, B(2)], [553, B(2)],
  [565, stationPos], [575, stationPos], [585, B(2)], [593, B(2)],
  [605, B(0)], [615, B(0)], [630, stationPos], [645, stationPos],
];
const cardioWP = [[458, OFF_A], [465, B(2)], [480, B(2)], [487, OFF_A]];
const nephroWP = [[493, OFF_A], [500, B(2)], [515, B(2)], [522, OFF_A]];
const idWP =     [[533, OFF_B], [540, B(2)], [555, B(2)], [562, OFF_B]];
const ptWP =     [[573, OFF_B], [580, B(2)], [595, B(2)], [602, OFF_B]];

function sampleWP(wp, t) {
  if (t <= wp[0][0]) return { pos: wp[0][1], active: t >= wp[0][0] - 0.01 };
  for (let i = 0; i < wp.length - 1; i++) {
    const [t0, p0] = wp[i], [t1, p1] = wp[i + 1];
    if (t >= t0 && t <= t1) {
      const f = t1 === t0 ? 1 : (t - t0) / (t1 - t0);
      return { pos: p0.clone().lerp(p1, f), active: true };
    }
  }
  return { pos: wp[wp.length - 1][1], active: false };
}
function trailPoints(wp, t) {
  const pts = [];
  for (const [tt, p] of wp) { if (tt <= t) pts.push(p.clone()); else break; }
  const s = sampleWP(wp, t);
  if (pts.length === 0 || pts[pts.length - 1].distanceTo(s.pos) > 0.001) pts.push(s.pos.clone());
  return pts;
}

// ---------- event log ----------
const EVENTS = [
  { t: 420, text: 'Nurse begins morning rounds', role: 'nurse' },
  { t: 425, text: 'Nurse checks Bed 1', role: 'nurse' },
  { t: 440, text: 'Nurse checks Bed 2', role: 'nurse' },
  { t: 455, text: 'Nurse checks Bed 4', role: 'nurse' },
  { t: 465, text: 'Cardiology arrives at Bed 3, unannounced', role: 'cardiology' },
  { t: 470, text: 'Nurse pulled to Bed 3 — interruption 1', role: 'nurse', pull: true },
  { t: 490, text: 'Nurse resumes rounds at Bed 6', role: 'nurse' },
  { t: 500, text: 'Nephrology arrives at Bed 3, unaware cardiology already visited', role: 'nephrology' },
  { t: 505, text: 'Nurse pulled to Bed 3 again — interruption 2', role: 'nurse', pull: true },
  { t: 525, text: 'Nurse checks Bed 5', role: 'nurse' },
  { t: 540, text: 'Infectious Disease arrives at Bed 3, third team today', role: 'id' },
  { t: 545, text: 'Nurse pulled to Bed 3 a third time — interruption 3', role: 'nurse', pull: true },
  { t: 565, text: 'Nurse catches up on documentation at the station', role: 'nurse' },
  { t: 580, text: 'Physical Therapy arrives at Bed 3 for a mobility eval', role: 'pt' },
  { t: 585, text: 'Nurse pulled to Bed 3 a fourth time — conflicting orders to reconcile', role: 'nurse', pull: true },
  { t: 605, text: 'Nurse resumes rounds at Bed 1, running behind', role: 'nurse' },
  { t: 645, text: 'Rounds finish 40 minutes behind schedule', role: 'nurse' },
];

const logPanel = document.getElementById('log-panel');
EVENTS.forEach((e, i) => {
  const row = document.createElement('div');
  row.className = 'log-item';
  row.dataset.i = i;
  row.innerHTML = `<span class="log-time">${minutesLabel(e.t)}</span><span>${e.text}</span>`;
  row.addEventListener('click', () => setTime(e.t));
  logPanel.appendChild(row);
});

function minutesLabel(m) {
  let h = Math.floor(m / 60), mm = m % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + String(mm).padStart(2, '0') + ' ' + ampm;
}

const slider = document.getElementById('slider');
const clockEl = document.getElementById('clock');
const pullCountEl = document.getElementById('pull-count');
const playBtn = document.getElementById('play-btn');

function setTime(t) {
  slider.value = t;
  render(t);
}

function render(t) {
  clockEl.textContent = minutesLabel(t);

  const n = sampleWP(nurseWP, t);
  nurseMarker.position.copy(n.pos);
  updateTrail(trailMeshes.nurse, trailPoints(nurseWP, t));

  [['cardiology', cardioWP, cardioMarker], ['nephrology', nephroWP, nephroMarker],
   ['id', idWP, idMarker], ['pt', ptWP, ptMarker]].forEach(([key, wp, mesh]) => {
    const s = sampleWP(wp, t);
    mesh.position.copy(s.pos);
    mesh.visible = s.active;
    updateTrail(trailMeshes[key], s.active ? trailPoints(wp, t) : trailPoints(wp, wp[0][0]));
  });

  let pulls = 0;
  EVENTS.forEach((e, i) => {
    const row = logPanel.children[i];
    row.classList.remove('done', 'current');
    if (e.t <= t) { row.classList.add('done'); if (e.pull) pulls++; }
  });
  let currentIdx = -1;
  EVENTS.forEach((e, i) => { if (e.t <= t) currentIdx = i; });
  if (currentIdx >= 0) logPanel.children[currentIdx].classList.add('current');
  pullCountEl.textContent = pulls;
}

slider.addEventListener('input', () => render(+slider.value));

let playing = false, rafId = null, lastTs = 0;
function tick(ts) {
  if (!playing) return;
  const dt = (ts - lastTs) / 1000; lastTs = ts;
  let t = +slider.value + dt * 18; // ~18 sim-minutes per second
  if (t >= 660) { t = 660; playing = false; playBtn.textContent = '▶'; }
  setTime(t);
  if (playing) rafId = requestAnimationFrame(tick);
}
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  if (playing) {
    if (+slider.value >= 660) setTime(420);
    lastTs = performance.now();
    rafId = requestAnimationFrame(tick);
  } else if (rafId) cancelAnimationFrame(rafId);
});

render(420);
</script>
