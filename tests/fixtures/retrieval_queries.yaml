# Labelled query set for SPEC-007 / ADR-0007's G2/G3 gate.
#
# How this was built, honestly: drafted by the N19-context-retrieval builder
# agent (Sonnet 5) from having just read every doc/spec/ADR in the corpus in
# full, then locating each answer's line range afterwards with grep/read
# rather than writing the query to match a remembered wording. SPEC-007 flags
# this as a real limitation ("architect-written queries risk encoding what the
# architect already knows the repository says") and there is no way to fully
# escape it for a single-session build — the mitigation here is a deliberate
# mix, not a single style of query:
#
#   - ~8 queries name an exact identifier, symbol or page anchor (SPEC-007's
#     own worked examples: "derive_episodes", "ADR-0005", "page 143"). These
#     are queries where lexical search is *expected* to win outright — SPEC-007
#     itself says grep must stay strictly better here, and a query set that
#     hid this class to flatter a vector index would be rigged in the other
#     direction.
#   - ~28 queries are phrased the way an agent actually wonders something —
#     paraphrased, not copying the document's own words — which is precisely
#     the case SPEC-007's "why this is not just grep" section argues lexical
#     search struggles with.
#
# Written once, before any retriever beyond a rough lexical prototype existed,
# and versioned here so a later session cannot quietly relabel it to move the
# number (SPEC-007, Test oracle). `relevant` entries mark a line range in a
# repo-relative file path; a retrieved chunk counts as a hit on a query if its
# own line range overlaps any marked span for that file.

queries:
